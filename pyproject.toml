[project]
name = "printbot"
version = "0.1.0"
description = "Telegram-driven thermal print server"
requires-python = ">=3.13"
dependencies = [
    "aiogram>=3",
    "pillow>=11.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.9",
    "python-escpos>=3.1",
    "pyyaml>=6.0",
]

[project.scripts]
printbot = "printbot.app:main"

[dependency-groups]
dev = [
    "import-linter>=2.1",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "ty>=0.0.1a1",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/printbot"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ERA", "C4", "PT", "ANN", "ARG", "TC", "PL"]
ignore = ["PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "B010", "PLR0913"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["hardware: requires a connected physical USB printer"]

[tool.importlinter]
root_package = "printbot"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = [
    "printbot.app",
    "printbot.messaging | printbot.storage",
    "printbot.jobs",
    "printbot.ingest | printbot.formatting | printbot.printing",
    "printbot.kernel",
]

[[tool.importlinter.contracts]]
name = "escpos is confined to escpos_usb"
type = "forbidden"
source_modules = [
    "printbot.kernel",
    "printbot.ingest",
    "printbot.formatting",
    "printbot.printing",
    "printbot.jobs",
    "printbot.storage",
    "printbot.messaging",
    "printbot.app",
]
forbidden_modules = ["escpos"]
ignore_imports = ["printbot.printing.escpos_usb -> escpos"]
